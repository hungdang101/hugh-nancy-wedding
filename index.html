<style>
:root{
  --wine:#5e0f1f; --wine-deep:#2e0610; --wine-mid:#7b1a2c; --seal:#a3172b;
  --gold:#d4af6a; --gold-soft:#ecd9a8; --gold-deep:#a8823f;
  --paper:#f7eedc; --paper-2:#efe1c4; --ink:#2b1913; --ink-soft:#6b4a3a;
  --display:"Cormorant Garamond","Noto Serif",Georgia,serif;
  --body:"Noto Serif",Georgia,serif;
  --brush:"Ma Shan Zheng","Noto Serif",serif;
  --carved:"CharmE","Noto Serif",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--body); color:var(--paper); background:var(--wine-deep);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(120% 80% at 50% 0%, #7b1a2c 0%, #4a0b18 55%, #2e0610 100%);}
.bg.has-photo{background-size:cover;background-position:center 30%;}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(46,6,16,.45) 0%, rgba(46,6,16,.72) 38%, rgba(46,6,16,.94) 70%, #2e0610 100%);}
.mountains{position:fixed;left:0;right:0;bottom:0;z-index:0;width:100%;height:38vh;opacity:.5;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 48px}
.lang{display:flex;justify-content:flex-end;gap:0}
.lang button{font:700 14px/1 var(--carved);letter-spacing:.08em;color:var(--gold-soft);background:rgba(46,6,16,.55);
  border:1px solid var(--gold-deep);padding:8px 12px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}
.lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--wine-deep)}

header{text-align:center;padding:18px 0 8px}
.hdr{margin:6px -6px 0;max-width:none;font-size:inherit;font-weight:inherit}
.hdr svg{display:block;width:100%;height:auto}
.date{font:700 22px/1.2 var(--carved);letter-spacing:.02em;margin-top:10px;color:var(--gold)}
.cloud-rule{display:block;margin:16px auto 0;width:220px;height:22px}

/* scroll card */
.scroll{position:relative;margin:30px 6px 0;padding:30px 22px 28px;color:var(--ink);
  background:
    radial-gradient(140% 90% at 50% 0%, rgba(255,255,255,.55), transparent 60%),
    linear-gradient(180deg,var(--paper),var(--paper-2));
  box-shadow:0 18px 40px rgba(0,0,0,.45)}
.scroll::before,.scroll::after{content:"";position:absolute;left:-14px;right:-14px;height:16px;border-radius:8px;
  background:linear-gradient(180deg,#5a1a10,#2a0a05 60%,#4a140c);
  box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,170,.25)}
.scroll::before{top:-9px}.scroll::after{bottom:-9px}
.rod-cap{position:absolute;width:12px;height:24px;border-radius:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-soft),var(--gold-deep));z-index:2}
.rod-cap.tl{top:-13px;left:-22px}.rod-cap.tr{top:-13px;right:-22px}.rod-cap.bl{bottom:-13px;left:-22px}.rod-cap.br{bottom:-13px;right:-22px}
.frame{border:1px solid rgba(123,26,44,.45);outline:3px double rgba(123,26,44,.35);outline-offset:4px;padding:22px 16px 20px;position:relative}
.corner{position:absolute;width:26px;height:26px;color:var(--wine-mid)}
.corner.tl{top:-4px;left:-4px}.corner.tr{top:-4px;right:-4px;transform:scaleX(-1)}
.corner.bl{bottom:-4px;left:-4px;transform:scaleY(-1)}.corner.br{bottom:-4px;right:-4px;transform:scale(-1,-1)}
h2{font:700 32px/1.15 var(--carved);color:var(--wine);text-align:center;margin:0 0 6px;letter-spacing:.04em}
.sub{text-align:center;color:var(--ink-soft);font-size:15px;margin:0 0 18px}
.search{position:relative}
.search input{width:100%;font:500 19px/1.2 var(--body);color:var(--ink);padding:15px 16px 15px 48px;
  background:#fffaf0;border:2px solid var(--wine-mid);border-radius:4px;outline:none;
  box-shadow:inset 0 2px 4px rgba(94,15,31,.08)}
.search input:focus{border-color:var(--seal);box-shadow:0 0 0 4px rgba(163,23,43,.18)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:var(--wine-mid)}
.hint{min-height:22px;margin:12px 2px 0;font-size:14.5px;color:var(--ink-soft);text-align:center}
.results{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.res{display:flex;align-items:center;gap:14px;padding:14px;background:#fffaf0;border:1px solid rgba(123,26,44,.25);
  border-left:4px solid var(--seal);border-radius:3px;animation:rise .25s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.who{flex:1;min-width:0}
.who .name{font:700 21px/1.2 var(--display);color:var(--ink);overflow-wrap:anywhere}
.who .name mark{background:none;color:var(--seal);text-decoration:underline;text-decoration-color:rgba(163,23,43,.4);text-underline-offset:3px}
.who .party{font-size:13.5px;color:var(--ink-soft);margin-top:4px;line-height:1.45}
.who .party b{font-weight:600;color:var(--ink)}
.seal{flex:none;width:76px;height:76px;display:grid;place-items:center;text-align:center;
  background:var(--seal);color:#fff1dc;border-radius:6px;transform:rotate(-3deg);
  box-shadow:inset 0 0 0 3px #a3172b, inset 0 0 0 5px rgba(255,241,220,.85), 0 3px 8px rgba(94,15,31,.35)}
.seal small{display:block;font:400 13px/1 var(--carved);letter-spacing:.02em;opacity:.9}
.seal strong{display:block;font:700 31px/1 var(--carved);font-variant-numeric:lining-nums;margin-top:2px;max-width:68px;overflow-wrap:anywhere}
.seal strong.long{font-size:17px;line-height:1.05}
.more{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:4px}
.mapbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:22px;padding:14px 16px;
  font:700 17px/1 var(--carved);letter-spacing:.02em;color:var(--gold-soft);cursor:pointer;
  background:linear-gradient(180deg,var(--wine-mid),var(--wine));border:1px solid var(--gold-deep);border-radius:4px;
  box-shadow:inset 0 0 0 3px var(--wine),inset 0 0 0 4px rgba(212,175,106,.55)}
.mapbtn svg{width:20px;height:20px}
footer{text-align:center;margin-top:34px;color:var(--gold-soft);font:italic 500 16px/1.4 var(--display);opacity:.85}
footer .zh{display:block;font-family:var(--brush);font-style:normal;font-size:26px;color:var(--gold);letter-spacing:.2em;margin-bottom:4px}

/* map viewer */
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,3,8,.94);display:none;flex-direction:column}
.modal.open{display:flex}
.modal .bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--gold-soft);
  font:600 16px/1 var(--body);border-bottom:1px solid rgba(212,175,106,.3)}
.modal .bar button{font:600 15px/1 var(--body);color:var(--wine-deep);background:var(--gold);border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.modal .view{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:12px}
.modal img{max-width:100%;height:auto;display:block;border:1px solid var(--gold-deep)}
.modal .tip{text-align:center;color:var(--gold-soft);opacity:.7;font-size:13px;padding:8px}
@media (min-width:600px){.wrap{padding-top:36px}}
@media (prefers-reduced-motion:reduce){.res{animation:none}}
</style>
</head>

  function norm(s){
    return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'')
      .replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function full(g){return (g.f+' '+g.l).trim();}

  var G = D.guests.map(function(g,i){
    var words = norm([g.f,g.l,g.a].join(' ')).split(' ').filter(Boolean);
    return {f:g.f||'',l:g.l||'',t:String(g.t),g:g.g||'',a:g.a||'',i:i,words:words,
            fn:norm(g.f+' '+g.l), rn:norm(g.l+' '+g.f), an:norm(g.a)};
  });
  var groups = {};
  G.forEach(function(g){ if(g.g){ (groups[g.g]=groups[g.g]||[]).push(g); } });

  // header
  var fst=document.createElement('style'); fst.textContent=WED_FONT_CSS; document.head.appendChild(fst);
  function drawHeader(){ document.getElementById('hdr').innerHTML = wedHeaderSVG(D.couple); }
  drawHeader();
  if(document.fonts){ Promise.all([document.fonts.load('40px BrushMSZ'),document.fonts.load('40px BrushKS','N')]).then(drawHeader,function(){}); }
  if(D.photo){ var bg=document.getElementById('bg'); bg.classList.add('has-photo'); bg.style.backgroundImage='url("'+D.photo+'")'; }
  if(D.map){ document.getElementById('mapbtn').hidden=false; document.getElementById('mapimg').src=D.map; }

  function t(k,n){ return T[lang][k].replace('{n}',n); }
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = T[lang][el.getAttribute('data-t')]; });
    document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.lang===lang)); });
    document.getElementById('q').placeholder = T[lang].ph;
    document.getElementById('date').textContent = lang==='vi' ? D.dateVi : D.dateEn;
    document.getElementById('mapimg').alt = T[lang].mapTitle;
    render();
  }

  function match(g, qn, qw){
    if(g.fn.indexOf(qn)===0 || g.rn.indexOf(qn)===0 || (g.an && g.an.indexOf(qn)===0)) return 3;
    // every typed word must start some word of the guest's name
    var all = qw.every(function(w){ return g.words.some(function(x){ return x.indexOf(w)===0; }); });
    if(all) return 2;
    if(qn.length>=3 && (g.fn.indexOf(qn)>=0 || g.rn.indexOf(qn)>=0)) return 1;
    return 0;
  }
  function highlight(name, qw){
    // underline the parts of the name that start with a typed word
    return name.split(/(\s+)/).map(function(part){
      var n = norm(part); if(!n) return esc(part);
      var hit = qw.some(function(w){ return n.indexOf(w)===0; });
      return hit ? '<mark>'+esc(part)+'</mark>' : esc(part);
    }).join('');
  }

  var qEl = document.getElementById('q'), hint = document.getElementById('hint'), out = document.getElementById('results');
  function render(){
    var qn = norm(qEl.value), qw = qn.split(' ').filter(Boolean);
    out.innerHTML = '';
    if(qn.replace(/ /g,'').length < 2){ hint.textContent = qn ? t('typeMore') : ''; return; }
    var hits = [];
    G.forEach(function(g){ var s = match(g,qn,qw); if(s) hits.push({g:g,s:s}); });
    hits.sort(function(a,b){ return b.s-a.s || a.g.l.localeCompare(b.g.l) || a.g.f.localeCompare(b.g.f); });
    if(!hits.length){ hint.textContent = t('none'); return; }
    hint.textContent = hits.length===1 ? t('found1') : t('foundN', hits.length);
    hits.slice(0,MAX).forEach(function(h){
      var g = h.g, tbl = esc(g.t);
      var mates = g.g ? groups[g.g].filter(function(m){ return m!==g; }) : [];
      var party = mates.length ? '<div class="party">'+esc(t('party'))+': '+mates.map(function(m){
          return '<b>'+esc(full(m))+'</b>'+(m.t!==g.t ? ' ('+esc(t('table'))+' '+esc(m.t)+')' : '');
        }).join(', ')+'</div>' : '';
      var div = document.createElement('div'); div.className='res';
      div.innerHTML = '<div class="who"><div class="name">'+highlight(full(g),qw)+'</div>'+party+'</div>'+
        '<div class="seal" aria-label="'+esc(t('table'))+' '+tbl+'"><div><small>'+esc(t('table'))+'</small><strong'+(g.t.length>3?' class="long"':'')+'>'+tbl+'</strong></div></div>';
      out.appendChild(div);
    });
    if(hits.length>MAX){ var m=document.createElement('p'); m.className='more'; m.textContent=t('more',MAX); out.appendChild(m); }
  }
  qEl.addEventListener('input', render);
  qEl.addEventListener('keydown', function(e){ if(e.key==='Enter') qEl.blur(); });
  document.querySelectorAll('.lang button').forEach(function(b){
    b.addEventListener('click', function(){ lang=b.dataset.lang; try{localStorage.setItem('seat-lang',lang);}catch(e){} applyLang(); });
  });
  var modal = document.getElementById('modal');
  document.getElementById('mapbtn').addEventListener('click', function(){ modal.classList.add('open'); });
  document.getElementById('closeMap').addEventListener('click', function(){ modal.classList.remove('open'); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') modal.classList.remove('open'); });
  applyLang();
})();
</script>
</body>
</html>
